<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Roulette</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Hamburger menu button — always visible, top-left -->
<button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>

<!-- Dropdown menu popup -->
<div class="menu-popup" id="menuPopup">
  <div class="menu-section">
    <button class="menu-item-btn" id="nextBookBtn">Next Book</button>
    <button class="menu-item-btn" id="historyBtn">History</button>
    <button class="menu-item-btn" id="scrollModeBtn">Scroll</button>
    <button class="menu-item-btn" id="themeToggle">☀️</button>
  </div>
  <div class="menu-divider"></div>
  <div class="menu-section">
    <div class="menu-label">Font size</div>
    <div class="menu-row">
      <button class="btn" id="fontDecrease">A−</button>
      <span class="value" id="fontValue">18</span>
      <button class="btn" id="fontIncrease">A+</button>
    </div>
  </div>
  <div class="menu-section">
    <div class="menu-label">Line height</div>
    <div class="menu-row">
      <button class="btn" id="lineDecrease">≡−</button>
      <span class="value" id="lineValue">1.7</span>
      <button class="btn" id="lineIncrease">≡+</button>
    </div>
  </div>
</div>

<main>
  <div class="reader">
    <div class="title" id="title"></div>
    <div class="author" id="author"></div>

    <div id="loadingContainer" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; background: var(--bg); color: var(--text);">
      <div style="font-size: 3rem; animation: pulse 1.5s ease-in-out infinite;">⟳</div>
      <div style="text-align: center;">
        <div id="loadingTitle" style="font-weight: bold; font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--text);">Loading your book...</div>
        <div id="loadingStatus" style="font-size: 0.95rem; color: var(--muted); margin-bottom: 1.5rem;"></div>

        <div id="loadingProgressContainer" style="display: none; width: 250px; margin: 0 auto;">
          <div style="background: var(--accent); border-radius: 4px; height: 4px; overflow: hidden; margin-bottom: 0.5rem;">
            <div id="loadingProgressFill" style="height: 100%; background: #4CAF50; width: 0%; transition: width 0.3s ease;"></div>
          </div>
          <div id="loadingProgressText" style="font-size: 0.75rem; color: var(--muted);"></div>
        </div>

        <div id="loadingSteps" style="text-align: left; display: inline-block; font-size: 0.9rem; margin-top: 1.5rem;">
          <div id="step-theme" class="loading-step" style="display: none; margin: 0.4rem 0; color: var(--muted);">
            <span class="step-icon">○</span> <span class="step-text">Applying theme</span>
          </div>
          <div id="step-preferences" class="loading-step" style="display: none; margin: 0.4rem 0; color: var(--muted);">
            <span class="step-icon">○</span> <span class="step-text">Loading preferences</span>
          </div>
          <div id="step-pagination" class="loading-step" style="display: none; margin: 0.4rem 0; color: var(--muted);">
            <span class="step-icon">○</span> <span class="step-text">Initializing reader</span>
          </div>
          <div id="step-book" class="loading-step" style="display: none; margin: 0.4rem 0; color: var(--muted);">
            <span class="step-icon">○</span> <span class="step-text">Loading book</span>
          </div>
        </div>
      </div>
    </div>

    <div class="spread" style="display: none;">
      <div class="page" id="leftPage"></div>
      <div class="page" id="rightPage"></div>
    </div>

    <div class="controls" style="display: none;">
      <button class="btn" id="prevPage">Prev</button>
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <button class="btn" id="nextPage">Next</button>
    </div>
  </div>
</main>

<div class="history-panel" id="historyPanel">
  <div class="history-panel-header">
    <h2>History</h2>
    <button class="btn history-close" id="historyClose">✕</button>
  </div>
  <div id="historyList"></div>
</div>

<script src="pagination.js"></script>
<script src="books.js"></script>
<script src="app.js"></script>

</body>
</html>
